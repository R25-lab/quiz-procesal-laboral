const QUESTIONS = [
  // === BLOQUE 1: PARTE GENERAL (Temas 1-7) — 30 preguntas ===
  { id: 1, block: 1, topic: 'Tema 1', q: '¿Cuál es el principal objetivo de la Ley Federal del Trabajo?', opts: ['Garantizar la igualdad formal entre patrón y trabajador', 'Equilibrar los factores de la producción (capital, trabajo y regulación del Estado)', 'Sancionar al patrón por incumplimientos', 'Crear nuevos derechos laborales constantemente'], a: 1, exp: 'La LFT busca equilibrar los tres factores de producción y compensar la desigualdad social en favor del trabajador.' },
  { id: 2, block: 1, topic: 'Tema 1', q: 'Según el art. 17 LFT, a falta de disposición expresa, ¿qué fuentes se aplican supletoriamente?', opts: ['Costumbre, jurisprudencia y equidad únicamente', 'Disposiciones que regulen casos semejantes, principios generales del derecho, principios de justicia social del art. 123, jurisprudencia, costumbre y equidad', 'Jurisprudencia y doctrina exclusivamente', 'Solo principios generales del derecho'], a: 1, exp: 'El art. 17 establece un orden de prelación que comienza con la analogía y luego acude a principios generales, jurisprudencia, costumbre y equidad.' },
  { id: 3, block: 1, topic: 'Tema 1', q: 'El derecho procesal del trabajo es autónomo porque:', opts: ['No depende del derecho civil en ningún caso', 'Tiene principios propios, órganos jurisdiccionales propios, objetivos diferentes y definitividad de sus resoluciones', 'Es derecho público', 'Sus normas son irrenunciables'], a: 1, exp: 'La autonomía se fundamenta en estos cuatro elementos, especialmente que no admite segunda instancia.' },
  { id: 4, block: 1, topic: 'Tema 1', q: '¿Existe supletoriedad del derecho procesal civil respecto al laboral?', opts: ['Sí, en todos los casos', 'Sí, cuando la LFT remite expresamente', 'No existe supletoriedad del derecho procesal civil en la LFT', 'Solo en materia de pruebas'], a: 2, exp: 'No existe supletoriedad: solo se aplican las reglas y supuestos propios de la LFT. La interpretación se rige por el art. 18 (in dubio pro operario).' },
  { id: 5, block: 1, topic: 'Tema 1', q: 'La parte sustantiva de la LFT regula:', opts: ['El conjunto de etapas y actos procesales', 'Los derechos y obligaciones de las partes', 'Las reglas de competencia territorial', 'Los medios de prueba'], a: 1, exp: 'La parte sustantiva contiene los derechos sustanciales; la parte adjetiva o procesal regula el procedimiento.' },
  { id: 6, block: 1, topic: 'Tema 1', q: 'La excepción al principio de igualdad procesal en materia laboral se justifica por:', opts: ['La voluntad de las partes', 'La desigualdad estructural de la relación laboral, donde el trabajador se encuentra en desventaja respecto del patrón', 'Una disposición constitucional sin contenido material', 'La complejidad técnica de los conflictos'], a: 1, exp: 'El principio de tutela del trabajador opera como contrapeso de la desigualdad social previa.' },
  { id: 7, block: 1, topic: 'Tema 2', q: 'La pretensión se define como:', opts: ['El derecho a acudir a los tribunales', 'La declaración de voluntad mediante la cual una persona solicita al órgano jurisdiccional que actúe frente a otra reclamando algo concreto', 'Una resolución judicial', 'Un acto procesal del juzgador'], a: 1, exp: 'La acción es el derecho subjetivo procesal; la pretensión es la declaración concreta de lo que se reclama.' },
  { id: 8, block: 1, topic: 'Tema 2', q: '¿Cuál es el efecto principal de la presentación de la demanda respecto a la prescripción?', opts: ['La consuma', 'No tiene efecto alguno', 'La interrumpe, ya sea ante tribunal competente o incompetente', 'Solo la suspende ante tribunal competente'], a: 2, exp: 'La interrupción opera incluso cuando se presenta ante autoridad incompetente.' },
  { id: 9, block: 1, topic: 'Tema 2', q: 'La acción de reinstalación con indemnización alternativa (3 meses + salarios vencidos) está prevista en:', opts: ['Art. 47 LFT', 'Art. 48 LFT', 'Art. 123 constitucional', 'Art. 700 LFT'], a: 1, exp: 'El art. 48 LFT regula la opción del trabajador entre reinstalación o indemnización de tres meses, más salarios vencidos hasta por doce meses.' },
  { id: 10, block: 1, topic: 'Tema 2', q: 'La acción de cumplimiento de contrato se ejercita para:', opts: ['Solicitar la nulidad de un contrato', 'Exigir el cumplimiento de obligaciones derivadas del contrato individual o colectivo', 'Pedir reinstalación', 'Solicitar revisión salarial'], a: 1, exp: 'Es una acción típica para reclamar prestaciones contractuales (vacaciones, aguinaldo, prima dominical, PTU, horas extras, etc.).' },
  { id: 11, block: 1, topic: 'Tema 3', q: '¿Cuál de los siguientes NO es un principio del proceso laboral conforme al art. 685 LFT?', opts: ['Inmediación', 'Oralidad predominante', 'Escritura predominante', 'Conciliación'], a: 2, exp: 'El proceso laboral es predominantemente oral, no escrito. El art. 685 enumera los principios: inmediación, inmediatez, continuidad, celeridad, veracidad, concentración, economía y sencillez, además de ser público, gratuito, oral y conciliatorio.' },
  { id: 12, block: 1, topic: 'Tema 3', q: '¿En qué artículo de la LFT se establece que las actuaciones procesales no causan impuesto alguno?', opts: ['Art. 17', 'Art. 18', 'Art. 19', 'Art. 20'], a: 2, exp: 'El art. 19 LFT consagra la exención fiscal de las actuaciones. El principio general de gratuidad del proceso también está reconocido en el art. 685.' },
  { id: 13, block: 1, topic: 'Tema 3', q: 'El principio de inmediación implica:', opts: ['Rapidez en el desarrollo del proceso', 'Que el juez debe estar presente en todas las audiencias y conducirlas personalmente', 'Realización de la mayor cantidad de actos en una sola audiencia', 'Búsqueda de la verdad real sobre la formal'], a: 1, exp: 'Inmediación = presencia y conducción directa del juez. Inmediatez es ausencia de dilaciones; concentración es agrupar actos.' },
  { id: 14, block: 1, topic: 'Tema 3', q: 'La exención al trabajador de la carga de la prueba se encuentra en:', opts: ['Art. 776 LFT', 'Art. 784 LFT', 'Art. 804 LFT', 'Art. 841 LFT'], a: 1, exp: 'El art. 784 LFT exime al trabajador de probar y desplaza la carga al patrón en supuestos específicos.' },
  { id: 15, block: 1, topic: 'Tema 4', q: 'La capacidad procesal en materia laboral implica:', opts: ['Solo la calidad para actuar en juicio', 'La facultad de un sujeto para desempeñar por sí mismo los derechos y obligaciones de los que es titular', 'Una representación delegada', 'La aptitud para celebrar contratos'], a: 1, exp: 'Es la aptitud legal para involucrarse personalmente en un litigio.' },
  { id: 16, block: 1, topic: 'Tema 4', q: 'La diferencia entre personalidad y legitimación radica en que:', opts: ['Son sinónimos', 'Personalidad es la aptitud para comparecer en juicio; legitimación es la titularidad del derecho en disputa', 'Personalidad es titularidad del derecho; legitimación es comparecer', 'Solo aplica una de ellas en materia laboral'], a: 1, exp: 'Una persona puede tener personalidad (capacidad para comparecer) sin tener legitimación (titularidad del derecho que reclama).' },
  { id: 17, block: 1, topic: 'Tema 4', q: '¿Qué edad mínima se requiere para comparecer a juicio como trabajador?', opts: ['14 años', '15 años', '16 años', '18 años'], a: 2, exp: 'Mayor de 16 años, salvo trabajos especiales. Menores de 16 son representados por la Procuraduría de la Defensa del Trabajo.' },
  { id: 18, block: 1, topic: 'Tema 5', q: '¿En qué consiste la jurisdicción según los apuntes?', opts: ['Es una facultad meramente administrativa', 'Es la función pública que ejercen los órganos del Estado a través del proceso para conocer de las controversias, emitir su decisión y ordenar su ejecución', 'Es solo la capacidad de emitir sentencias declarativas', 'Es la potestad de las partes para someter su conflicto a árbitros'], a: 1, exp: 'La jurisdicción incluye conocer, decidir y ejecutar; es delegada en tribunales federales, locales y Centros de Conciliación.' },
  { id: 19, block: 1, topic: 'Tema 5', q: 'En conflictos individuales, la competencia por territorio (art. 700) permite al actor escoger entre:', opts: ['Solo el tribunal del domicilio del demandado', 'Tribunal del lugar de celebración del contrato, del domicilio de cualquier demandado, o del lugar de prestación de servicios', 'Cualquier tribunal del país', 'Solo el del lugar de prestación de servicios'], a: 1, exp: 'El art. 700 fracc. II consagra la libre elección de foro en favor del trabajador. Si se prestó el servicio en varios lugares, será el del último.' },
  { id: 20, block: 1, topic: 'Tema 5', q: 'Las cuestiones de competencia en materia laboral sólo pueden promoverse por:', opts: ['Inhibitoria', 'Declinatoria', 'Recusación', 'Excusa'], a: 1, exp: 'El art. 703 LFT establece la declinatoria como única vía.' },
  { id: 21, block: 1, topic: 'Tema 5', q: '¿Hasta cuándo puede oponerse la declinatoria?', opts: ['En cualquier momento', 'Hasta la audiencia preliminar, acompañando los elementos en que se funde', 'Solo en la contestación', 'Después de la audiencia de juicio'], a: 1, exp: 'Art. 703 LFT. El Tribunal dicta resolución en el acto, tras oír a las partes.' },
  { id: 22, block: 1, topic: 'Tema 5', q: '¿Hasta cuándo puede el Tribunal declararse incompetente de oficio (art. 701)?', opts: ['Solo al inicio del proceso', 'En cualquier estado del proceso, hasta antes de la audiencia de juicio', 'Hasta antes del laudo', 'Nunca, solo a petición de parte'], a: 1, exp: 'Art. 701 LFT. Cuando existan en el expediente datos que lo justifiquen.' },
  { id: 23, block: 1, topic: 'Tema 5', q: 'La negativa de la relación de trabajo (art. 702):', opts: ['Constituye una excepción de incompetencia', 'NO se considera excepción de incompetencia', 'Es siempre una defensa de fondo', 'Implica admisión tácita'], a: 1, exp: 'Art. 702 LFT: "No se considerará excepción de incompetencia la defensa consistente en la negativa de la relación de trabajo".' },
  { id: 24, block: 1, topic: 'Tema 5', q: 'Cuando en la misma demanda se ejerciten acciones relacionadas con capacitación y adiestramiento o seguridad e higiene (art. 699):', opts: ['Todo se resuelve por el tribunal local', 'El conocimiento de estas materias corresponde al Tribunal Federal, aun cuando el resto sea competencia local', 'Se desecha la demanda', 'Se acumula con otro juicio'], a: 1, exp: 'Es la excepción a la indivisibilidad de la competencia: el tribunal local remite copia al federal para esas materias.' },
  { id: 25, block: 1, topic: 'Tema 5', q: '¿Cuál es el efecto de lo actuado ante autoridad incompetente (art. 706)?', opts: ['Todo es válido', 'Es nulo, salvo la admisión de la demanda y el convenio celebrado en período de conciliación', 'Solo es nulo el laudo', 'Se anula desde la primera notificación sin excepción'], a: 1, exp: 'El art. 706 LFT establece esas salvedades a la nulidad.' },
  { id: 26, block: 1, topic: 'Tema 6', q: 'El procedimiento de conciliación prejudicial no deberá exceder de:', opts: ['30 días naturales', '45 días naturales', '60 días naturales', '90 días naturales'], a: 1, exp: '45 días naturales es el plazo máximo del procedimiento conciliatorio.' },
  { id: 27, block: 1, topic: 'Tema 6', q: 'Con la reforma laboral derivada del Decreto del 1° de mayo de 2019, ¿qué ocurrió con la función jurisdiccional en materia laboral?', opts: ['Se mantuvo sin cambios', 'Pasó a tribunales del Poder Judicial Federal o Local, mientras que la función conciliatoria se trasladó a los Centros de Conciliación', 'Se concentró en la Secretaría del Trabajo', 'Se federalizó en su totalidad'], a: 1, exp: 'La reforma separó las funciones jurisdiccionales (tribunales del Poder Judicial) de las conciliatorias (Centros de Conciliación).' },
  { id: 28, block: 1, topic: 'Tema 7', q: 'La representación legal sindical se encuentra prevista en:', opts: ['Art. 11 LFT', 'Art. 375 LFT', 'Art. 692 LFT', 'Art. 700 LFT'], a: 1, exp: 'El art. 375 LFT establece que los sindicatos representan a sus miembros en la defensa de derechos individuales.' },
  { id: 29, block: 1, topic: 'Tema 7', q: '¿Cuál es la vigencia de los poderes en materia laboral?', opts: ['1 año', '2 años', '3 años', 'Indefinida'], a: 1, exp: 'Los poderes tienen vigencia de 2 años y sus facultades deben constar en el acta constitutiva.' },
  { id: 30, block: 1, topic: 'Tema 7', q: 'Cuando dos o más personas ejerciten la misma acción u opongan la misma excepción en un mismo juicio (art. 697):', opts: ['Pueden actuar por separado libremente', 'Deben litigar unidas y con una representación común, salvo intereses opuestos', 'Solo el primero en presentar tendrá legitimación', 'El tribunal debe escindir el juicio'], a: 1, exp: 'El art. 697 LFT regula el litisconsorcio con representación común.' },

  // === BLOQUE 2: DEMANDA Y ACTUACIONES (Temas 8-12) — 26 preguntas ===
  { id: 31, block: 2, topic: 'Tema 8', q: 'La demanda laboral debe presentarse:', opts: ['Oralmente', 'Por escrito, acompañando tantas copias como demandados haya', 'Por correo electrónico únicamente', 'Solo ante notario público'], a: 1, exp: 'Art. 872 LFT.' },
  { id: 32, block: 2, topic: 'Tema 8', q: 'Si el demandante es el trabajador y faltan copias de la demanda:', opts: ['Es causa de desechamiento', 'Se previene al actor con apercibimiento', 'El Tribunal deberá subsanar de oficio dicha falta', 'El expediente se archiva'], a: 2, exp: 'Art. 872 LFT establece que la falta de copias no es causa de prevención, archivo ni desechamiento cuando el actor es el trabajador.' },
  { id: 33, block: 2, topic: 'Tema 8', q: '¿Qué documento debe anexarse obligatoriamente a la demanda laboral?', opts: ['Recibo de pago de impuestos', 'Constancia expedida por el Organismo de Conciliación que acredite la conclusión del procedimiento sin acuerdo', 'Certificado de antecedentes no penales', 'Acta constitutiva del patrón'], a: 1, exp: 'Es requisito de procedibilidad agotar la conciliación prejudicial, salvo supuestos exceptuados.' },
  { id: 34, block: 2, topic: 'Tema 8', q: 'Si el trabajador ignora el nombre o denominación del patrón:', opts: ['No puede demandar', 'Debe esperar a conocerlo para demandar', 'Puede aportar cualquier dato útil para su identificación', 'Debe contratar un investigador privado'], a: 2, exp: 'La LFT permite suplir la falta de nombre con cualquier dato útil cuando el actor es el trabajador.' },
  { id: 35, block: 2, topic: 'Tema 8', q: 'La litis en el proceso laboral se conforma con:', opts: ['Solo la demanda y la contestación', 'La pretensión del actor y las excepciones y defensas del demandado, fijándose con demanda, contestación, réplica y contrarréplica', 'La sentencia interlocutoria', 'El laudo definitivo'], a: 1, exp: 'La litis se va fijando a lo largo de la fase escrita.' },
  { id: 36, block: 2, topic: 'Tema 9', q: '¿Qué efecto produce el silencio o las evasivas en la contestación de demanda?', opts: ['Se admite prueba en contrario', 'Hacen que se tengan por admitidos los hechos sobre los que no se suscite controversia, sin admitir prueba en contrario', 'Solo afectan al patrón', 'Ningún efecto procesal'], a: 1, exp: 'El silencio o evasiva equivale a admisión, sin que sea admisible prueba en contrario.' },
  { id: 37, block: 2, topic: 'Tema 9', q: 'La negación pura y simple del derecho:', opts: ['Implica la confesión de los hechos', 'Tiene el mismo efecto que negar los hechos', 'Implica la aceptación del derecho', 'No tiene consecuencias procesales'], a: 0, exp: 'Negar el derecho sin negar hechos equivale a confesar los hechos. La confesión de hechos no entraña aceptación del derecho.' },
  { id: 38, block: 2, topic: 'Tema 9', q: 'En caso de que el demandado niegue la relación de trabajo:', opts: ['Debe ofrecer pruebas contundentes específicas', 'Podrá negar los hechos en forma genérica', 'Se le tendrá por confeso automáticamente', 'Pierde el derecho a contestar'], a: 1, exp: 'La negación de la relación de trabajo permite negar los hechos genéricamente, como excepción a la regla.' },
  { id: 39, block: 2, topic: 'Tema 9', q: 'La reconvención (contrademanda) debe hacerse valer:', opts: ['En escrito separado durante la audiencia de juicio', 'Por economía procesal, al momento de contestar la demanda principal', 'Solo después del laudo', 'En la audiencia preliminar'], a: 1, exp: 'La reconvención se plantea junto con la contestación.' },
  { id: 40, block: 2, topic: 'Tema 9', q: 'El plazo para que el actor formule réplica tras correrle traslado con la contestación es de:', opts: ['3 días', '5 días', '8 días', '15 días'], a: 2, exp: 'Art. 873-B LFT: 8 días para réplica.' },
  { id: 41, block: 2, topic: 'Tema 9', q: 'El plazo para que el demandado formule contrarréplica una vez recibido el traslado con la réplica es de:', opts: ['3 días', '5 días', '8 días', '10 días'], a: 1, exp: 'Art. 873-C LFT: 5 días para contrarréplica.' },
  { id: 42, block: 2, topic: 'Tema 10', q: '¿Cuáles son los medios de apremio que puede imponer el Tribunal?', opts: ['Solo multas', 'Multas, presentación con auxilio de la fuerza pública y arresto hasta por 36 horas', 'Prisión preventiva', 'Cárcel administrativa por 72 horas'], a: 1, exp: 'Son medios de apremio para hacer cumplir las determinaciones del Tribunal.' },
  { id: 43, block: 2, topic: 'Tema 10', q: 'Las audiencias laborales son:', opts: ['Privadas siempre', 'Públicas, salvo casos excepcionales por la naturaleza del asunto', 'Reservadas exclusivamente a las partes', 'Cerradas al público en todo caso'], a: 1, exp: 'El principio de publicidad rige el proceso laboral, con excepciones puntuales.' },
  { id: 44, block: 2, topic: 'Tema 10', q: 'El incidente de reposición de autos procede cuando:', opts: ['Se pierde o destruye el expediente', 'Hay una mala notificación', 'Cambia el juez', 'Las partes lo solicitan voluntariamente'], a: 0, exp: 'Se tramita como incidente para reconstruir el procedimiento con las constancias existentes.' },
  { id: 45, block: 2, topic: 'Tema 11', q: '¿Cuándo comienzan a correr los términos en materia laboral (art. 733)?', opts: ['El mismo día de la notificación', 'El día siguiente al en que surta efecto la notificación, contándose el día del vencimiento', 'Tres días después de la notificación', 'Cuando lo determine el juez'], a: 1, exp: 'Art. 733 LFT.' },
  { id: 46, block: 2, topic: 'Tema 11', q: 'Cuando algún acto procesal no tenga término fijado, éste será de:', opts: ['24 horas', '3 días hábiles', '5 días hábiles', '8 días hábiles'], a: 1, exp: 'Art. 735 LFT: regla supletoria de 3 días hábiles.' },
  { id: 47, block: 2, topic: 'Tema 11', q: 'Para computar los términos, los meses se regularán por (art. 736):', opts: ['Días hábiles únicamente', '30 días naturales', 'Días calendario completos del mes correspondiente', '28 días'], a: 1, exp: 'Los meses laborales se cuentan como 30 días naturales; los días hábiles son de 24 horas naturales.' },
  { id: 48, block: 2, topic: 'Tema 11', q: '¿Cuál de las siguientes notificaciones NO se hace personalmente (art. 742)?', opts: ['Emplazamiento a juicio', 'Auto de radicación remitido por tribunales de otra competencia', 'Acuerdos de mero trámite', 'Sentencia laboral no dictada en audiencia'], a: 2, exp: 'Los acuerdos de mero trámite se notifican por boletín; las del art. 742 son taxativas personales.' },
  { id: 49, block: 2, topic: 'Tema 11', q: 'Las notificaciones a través del Buzón Electrónico:', opts: ['Solo proceden cuando el Tribunal lo ordena', 'Surten efectos para las partes que así lo soliciten, y las constancias son medios de prueba', 'No tienen validez', 'Sustituyen totalmente las personales'], a: 1, exp: 'Las constancias de notificación electrónica son medios probatorios (art. 776 fracc. IX).' },
  { id: 50, block: 2, topic: 'Tema 11', q: '¿Cuál NO es un requisito de la cédula de notificación (art. 751)?', opts: ['Lugar, día y hora en que se practique', 'Número de expediente y nombre de las partes', 'Nombre y domicilio de la persona a notificar', 'Firma autógrafa del juez en cada cédula'], a: 3, exp: 'La cédula la emiten los actuarios; lleva firma del actuario y copia de la resolución, pero no requiere firma del juez en cada notificación.' },
  { id: 51, block: 2, topic: 'Tema 11', q: 'La diferencia entre exhorto y despacho es que:', opts: ['Son sinónimos', 'El exhorto es auxilio judicial entre autoridades de la misma competencia pero distinta jurisdicción dentro del país; el despacho es el mismo auxilio pero en el extranjero', 'El despacho es interno y el exhorto externo', 'Solo aplica uno en materia laboral'], a: 1, exp: 'El exhorto es nacional; el despacho es internacional.' },
  { id: 52, block: 2, topic: 'Tema 12', q: 'Los incidentes de previo y especial pronunciamiento:', opts: ['Se resuelven al final del juicio', 'Deben resolverse antes de que se decida la controversia principal mediante resolución interlocutoria', 'No suspenden el procedimiento', 'Solo aplican en huelga'], a: 1, exp: 'Suspenden el principal hasta que se emita resolución interlocutoria.' },
  { id: 53, block: 2, topic: 'Tema 12', q: '¿Cuál de los siguientes NO se tramita como incidente de previo y especial pronunciamiento?', opts: ['Nulidad', 'Competencia', 'Falta de personalidad', 'Ofrecimiento de pruebas'], a: 3, exp: 'El ofrecimiento de pruebas es parte del trámite ordinario, no un incidente.' },
  { id: 54, block: 2, topic: 'Tema 12', q: 'El incidente de nulidad puede interponerse:', opts: ['Solo en la contestación', 'En cualquier momento hasta antes de la sentencia', 'Después de la sentencia firme', 'Solo durante la ejecución'], a: 1, exp: 'Procede en cualquier momento antes de la sentencia, para invalidar notificaciones o actuaciones irregulares.' },
  { id: 55, block: 2, topic: 'Tema 12', q: 'La acumulación procede (art. 766) cuando:', opts: ['Solo si las partes lo acuerdan expresamente', 'Entre otros supuestos, cuando se trata de juicios promovidos por el mismo actor contra el mismo demandado por las mismas prestaciones, o cuando las prestaciones, aunque distintas, derivan de la misma relación', 'Únicamente entre conflictos colectivos', 'Cuando ya se dictó sentencia'], a: 1, exp: 'El art. 766 LFT contempla varios supuestos de acumulación de oficio o a petición de parte.' },
  { id: 56, block: 2, topic: 'Tema 12', q: 'El incidente de falta de personalidad surge cuando:', opts: ['El testigo no se identifica', 'Se considera que quien comparece representando a la contraparte carece de personalidad', 'No hay carga de la prueba', 'La demanda es incompetente'], a: 1, exp: 'Es común que se plantee al inicio del proceso, en la etapa de demanda y excepciones.' },

  // === BLOQUE 3: PRUEBAS (Temas 13-18) — 33 preguntas ===
  { id: 57, block: 3, topic: 'Tema 13', q: '¿Qué medios de prueba son admisibles en el proceso laboral (art. 776)?', opts: ['Solo confesional y documental', 'Todos los medios que no sean contrarios a la moral y al derecho', 'Solo los enumerados expresamente y nada más', 'Únicamente los aceptados por las partes'], a: 1, exp: 'El art. 776 LFT admite todos los medios que no sean contrarios a la moral y al derecho.' },
  { id: 58, block: 3, topic: 'Tema 13', q: 'Las sentencias laborales se dictan:', opts: ['Conforme a reglas estrictas de valoración tasada', 'A verdad sabida y buena fe guardada, apreciando los hechos en conciencia', 'Solo con base en pruebas documentales', 'Únicamente con dictamen pericial'], a: 1, exp: 'El sistema de valoración es flexible y en conciencia, pero el Tribunal debe expresar los motivos y fundamentos.' },
  { id: 59, block: 3, topic: 'Tema 13', q: 'Las pruebas sobre hechos supervinientes pueden ofrecerse:', opts: ['Solo en la demanda', 'Hasta antes de emitir sentencia, dentro de los tres días siguientes a su conocimiento', 'Después del laudo', 'En cualquier momento sin restricción'], a: 1, exp: 'Son los hechos conocidos después de la audiencia de ofrecimiento o sobrevenidos. Art. 778 LFT.' },
  { id: 60, block: 3, topic: 'Tema 13', q: '¿Qué tipo de hechos NO requieren prueba?', opts: ['Los hechos controvertidos', 'Los hechos notorios, confesados, admitidos por la contraparte y derivados de presunciones legales', 'Los probados por testigos', 'Los señalados por el actor'], a: 1, exp: 'Art. 777 LFT.' },
  { id: 61, block: 3, topic: 'Tema 13', q: 'Conforme al art. 779 LFT, el Tribunal desechará las pruebas que:', opts: ['Le incomoden', 'No tengan relación con la litis o resulten inútiles o intrascendentes, expresando el motivo', 'Sean ofrecidas por el patrón únicamente', 'Sean ofrecidas tras la demanda'], a: 1, exp: 'El desechamiento debe motivarse.' },
  { id: 62, block: 3, topic: 'Tema 14', q: '¿A quién corresponde la carga de la prueba en los casos de rescisión laboral?', opts: ['Al trabajador', 'Al empleador', 'A ambos por partes iguales', 'Al juez de oficio'], a: 1, exp: 'En rescisión, el patrón debe probar la causa; en otros supuestos, está obligado a probar quien afirma.' },
  { id: 63, block: 3, topic: 'Tema 14', q: '¿Cuántas faltas injustificadas en un mes son causa de rescisión laboral?', opts: ['Dos', 'Más de tres en un período de treinta días', 'Cinco', 'Siete'], a: 1, exp: 'Art. 47 LFT.' },
  { id: 64, block: 3, topic: 'Tema 14', q: 'Entre los documentos que el patrón debe conservar y exhibir en juicio (art. 804) están:', opts: ['Solo los contratos individuales', 'Contratos, listas de raya o nómina, controles de asistencia, comprobantes de utilidades, vacaciones, aguinaldos y aportaciones de seguridad social', 'Solo las nóminas', 'Únicamente los recibos de pago de salarios'], a: 1, exp: 'El art. 804 LFT enumera taxativamente los documentos que el patrón debe conservar y exhibir.' },
  { id: 65, block: 3, topic: 'Tema 14', q: 'La carga genérica del patrón en materia probatoria consiste en:', opts: ['Aportar todas las pruebas del trabajador', 'La obligación general de conservar y exhibir en juicio los documentos relacionados con la relación laboral', 'Defenderse de todas las acciones', 'Pagar el peritaje siempre'], a: 1, exp: 'La carga específica se refiere a documentos concretos y plazos de conservación.' },
  { id: 66, block: 3, topic: 'Tema 15', q: 'La prueba confesional se solicita para que la contraparte:', opts: ['Concurra a absolver posiciones y responder preguntas', 'Aporte pruebas documentales', 'Designe un perito', 'Identifique a sus testigos'], a: 0, exp: 'Art. 786 LFT.' },
  { id: 67, block: 3, topic: 'Tema 15', q: '¿Cómo se formulan las preguntas en la confesional según las reglas vigentes (art. 790)?', opts: ['Por escrito en pliego sellado', 'En forma oral durante la audiencia mediante interrogatorio abierto, sin presentación de pliegos, sobre hechos controvertidos en términos claros y precisos', 'Solo mediante posiciones cerradas en pliego', 'Por vía electrónica diferida'], a: 1, exp: 'La reforma cambió a interrogatorio abierto y oral.' },
  { id: 68, block: 3, topic: 'Tema 15', q: 'En el caso de personas morales, la confesional puede desahogarse por:', opts: ['Cualquier empleado', 'Su representante legal o apoderado con facultades para absolver posiciones', 'El gerente de recursos humanos exclusivamente', 'Cualquier accionista'], a: 1, exp: 'Sindicatos absuelven por conducto de su secretario general o representante estatutariamente autorizado.' },
  { id: 69, block: 3, topic: 'Tema 15', q: 'Si el absolvente, debidamente citado, no comparece a desahogar la confesional (art. 789):', opts: ['Se cita nuevamente sin consecuencia', 'Se hará efectivo el apercibimiento y se le declarará confeso de las posiciones articuladas y calificadas de legales', 'Se desecha la prueba', 'El Tribunal lo presenta con auxilio de la fuerza pública'], a: 1, exp: 'Es la consecuencia procesal por no comparecer estando debidamente citado.' },
  { id: 70, block: 3, topic: 'Tema 15', q: 'Cuando la persona que deba absolver posiciones tiene su residencia fuera del lugar del Tribunal (art. 791), la confesional:', opts: ['Se desecha', 'Se rinde vía remota a través de videoconferencia mediante exhorto', 'Se difiere indefinidamente', 'Se sustituye por testimonial'], a: 1, exp: 'El Tribunal exhortante conduce el desahogo por videoconferencia.' },
  { id: 71, block: 3, topic: 'Tema 15', q: 'Si fueren varios los declarantes en la confesional (art. 790 Bis):', opts: ['Declaran todos juntos para que sus testimonios concuerden', 'Se practicarán las diligencias evitando que los que declaren primero se comuniquen con los que lo hagan después; los segundos permanecerán en sala distinta', 'Solo declara el primero', 'Declaran por escrito'], a: 1, exp: 'Esta disposición no aplica para el actor ni el demandado.' },
  { id: 72, block: 3, topic: 'Tema 16', q: 'Los documentos públicos son aquellos:', opts: ['Cualquier documento firmado por dos personas', 'Cuya formulación está encomendada por la Ley a un funcionario investido de fe pública', 'Los publicados en periódico oficial', 'Los que están en el dominio público'], a: 1, exp: 'Los privados son los que no reúnen estas características.' },
  { id: 73, block: 3, topic: 'Tema 16', q: 'La compulsa es:', opts: ['La impugnación de un documento', 'La certificación de que una copia es fiel al original, generalmente de documentos en poder de terceros', 'Una citación para audiencia', 'Un embargo precautorio'], a: 1, exp: 'Aplica para documentos en poder de terceros como bancos o instituciones públicas. Se realiza por conducto del actuario (art. 807).' },
  { id: 74, block: 3, topic: 'Tema 16', q: 'Si se objeta la autenticidad de un documento en cuanto a contenido, firma o huella digital (art. 811):', opts: ['Pierden todo valor automáticamente', 'Las partes podrán ofrecer pruebas respecto de las objeciones, las que se recibirán en la audiencia de desahogo de pruebas', 'Se devuelven al oferente sin trámite', 'Se ordena cotejo notarial'], a: 1, exp: 'La controversia documental se prueba en audiencia.' },
  { id: 75, block: 3, topic: 'Tema 16', q: 'Los documentos que las partes presenten antes de la audiencia preliminar (art. 810):', opts: ['Se desechan automáticamente', 'Serán cotejados con los originales por el secretario instructor y los originales se devuelven previa razón en autos', 'Solo se admiten con notario público', 'Quedan en custodia del Tribunal hasta sentencia'], a: 1, exp: 'El cotejo asegura autenticidad sin retener originales innecesariamente.' },
  { id: 76, block: 3, topic: 'Tema 17', q: '¿Cuál es el número máximo de testigos por hecho controvertido que puede ofrecerse (art. 813)?', opts: ['Uno', 'Dos', 'Tres', 'Sin límite'], a: 2, exp: 'Art. 813 fracc. I LFT.' },
  { id: 77, block: 3, topic: 'Tema 17', q: 'En el desahogo de la testimonial, los testigos:', opts: ['Declaran en grupo', 'Son examinados por separado en el orden en que fueron ofrecidos', 'Pueden ser entrevistados conjuntamente por las partes antes', 'Solo declaran por escrito'], a: 1, exp: 'Art. 815 LFT.' },
  { id: 78, block: 3, topic: 'Tema 17', q: 'Si el testigo no se identifica con documento oficial:', opts: ['Su declaración tiene pleno valor', 'Se dejará sin efectos la declaración', 'Se le impone una multa', 'Puede declarar bajo seudónimo'], a: 1, exp: 'La identificación con documento oficial vigente es requisito.' },
  { id: 79, block: 3, topic: 'Tema 17', q: 'Un solo testigo puede formar convicción cuando:', opts: ['Es familiar de la parte que lo ofrece', 'Fue el único que se percató de los hechos, su declaración no contradiga otras pruebas y concurran en él circunstancias que sean garantía de veracidad', 'Su declaración es contradicha por otras pruebas', 'Es testigo del patrón'], a: 1, exp: 'La regla del testigo único exige verosimilitud y coherencia.' },
  { id: 80, block: 3, topic: 'Tema 17', q: 'Las tachas a los testigos son:', opts: ['Errores de transcripción', 'Objeciones formuladas respecto de la credibilidad, imparcialidad o idoneidad de un testigo (parentesco, enemistad, incapacidad moral, interés en el resultado)', 'Sanciones económicas', 'Una excepción dilatoria'], a: 1, exp: 'Pretenden evidenciar circunstancias que afectan la veracidad o muestran interés.' },
  { id: 81, block: 3, topic: 'Tema 17', q: 'Cuando el testigo sea servidor público (art. 813 fracc. IV):', opts: ['Comparece físicamente al Tribunal siempre', 'Rendirá su declaración por medio de oficio en vía de informe', 'Su declaración se desecha', 'Solo puede declarar bajo protesta especial'], a: 1, exp: 'Es una regla de eficiencia procesal.' },
  { id: 82, block: 3, topic: 'Tema 18', q: 'La prueba pericial debe ofrecerse:', opts: ['Sin requisitos adicionales', 'Indicando la materia y exhibiendo el cuestionario respectivo con copia para cada parte', 'Solo nombrando al perito', 'Después de la audiencia de juicio'], a: 1, exp: 'La omisión del cuestionario impide la admisión de la prueba.' },
  { id: 83, block: 3, topic: 'Tema 18', q: 'La omisión del cuestionario al ofrecer la prueba pericial provoca que:', opts: ['Se admita con apercibimiento', 'El Tribunal no admita la prueba', 'Se difiera el desahogo', 'Se sustituya por testimonial'], a: 1, exp: 'Es requisito de admisión.' },
  { id: 84, block: 3, topic: 'Tema 18', q: 'Al admitir la prueba pericial, el Tribunal:', opts: ['Espera el dictamen de las partes', 'Designará al perito o peritos oficiales que estime necesarios; las partes pueden acompañarse de un asesor', 'Convoca a sorteo entre peritos privados', 'Suspende el proceso indefinidamente'], a: 1, exp: 'El trabajador puede solicitar a la Defensoría Pública o Procuraduría que le asigne un asesor.' },
  { id: 85, block: 3, topic: 'Tema 18', q: 'La prueba de inspección (art. 827) debe ofrecerse:', opts: ['De forma genérica', 'En sentido afirmativo, precisando objeto, períodos y hechos que se pretenden acreditar', 'Después de la contestación', 'Solo en alegatos finales'], a: 1, exp: 'El ofrecimiento debe ser afirmativo y específico.' },
  { id: 86, block: 3, topic: 'Tema 18', q: 'La presunción legal (art. 830) se da cuando:', opts: ['Las partes la invocan expresamente', 'La Ley la establece expresamente o se deriva de la aplicación de principios del derecho del trabajo', 'El juez la decide discrecionalmente sin base normativa', 'Solo se aplica en huelga'], a: 1, exp: 'Distinta a la presunción humana.' },
  { id: 87, block: 3, topic: 'Tema 18', q: 'La presunción humana se da cuando:', opts: ['Las partes la convienen', 'De un hecho debidamente probado se deduce otro que es consecuencia de aquél', 'La ley la establece expresamente', 'Surge de un dictamen pericial'], a: 1, exp: 'Es el razonamiento deductivo del juzgador a partir de un hecho conocido.' },
  { id: 88, block: 3, topic: 'Tema 18', q: 'La prueba instrumental (art. 835) se refiere a:', opts: ['Solo peritajes técnicos', 'El conjunto de actuaciones y elementos que obren en el expediente y los anexos formados con motivo del juicio', 'Documentos públicos exclusivamente', 'Instrumentos electrónicos solamente'], a: 1, exp: 'El Tribunal está obligado a tomarla en cuenta de oficio (art. 836).' },
  { id: 89, block: 3, topic: 'Tema 18', q: 'El Tribunal valora la prueba pericial:', opts: ['Conforme a tarifa fija', 'En conciencia, considerando los conocimientos técnicos del perito y la coherencia de sus conclusiones', 'Aceptando siempre al perito del actor', 'Solo si todos los peritos coinciden'], a: 1, exp: 'La valoración es en conciencia, como el resto del sistema probatorio laboral.' },

  // === BLOQUE 4: RESOLUCIONES Y PROCEDIMIENTOS (Temas 19-22) — 19 preguntas ===
  { id: 90, block: 4, topic: 'Tema 19', q: '¿Qué resolución decide sobre el fondo del conflicto?', opts: ['Acuerdo', 'Auto incidental o resolución interlocutoria', 'Sentencia definitiva', 'Cédula de notificación'], a: 2, exp: 'Los acuerdos son trámite, las interlocutorias resuelven incidentes, y la sentencia el fondo.' },
  { id: 91, block: 4, topic: 'Tema 19', q: 'Tras la notificación de la sentencia, ¿en qué plazo puede solicitarse su aclaración (art. 847)?', opts: ['Inmediatamente', 'Dentro de tres días', 'Cinco días', 'Quince días'], a: 1, exp: 'La aclaración procede para corregir errores o precisar algún punto, sin modificar el fondo.' },
  { id: 92, block: 4, topic: 'Tema 19', q: '¿Cuál de los siguientes NO es un requisito de la sentencia (art. 840)?', opts: ['Lugar, fecha y Tribunal', 'Extracto de demanda, contestación, réplica y contrarréplica', 'Razones legales o de equidad y puntos resolutivos', 'Aprobación firmada por las partes del juicio'], a: 3, exp: 'La sentencia no se firma por las partes; el art. 840 enumera sus requisitos sin incluir consentimiento.' },
  { id: 93, block: 4, topic: 'Tema 19', q: 'Los puntos resolutivos de una sentencia son:', opts: ['Las consideraciones doctrinales', 'El resumen de la sentencia donde se concretan las determinaciones del Tribunal', 'El extracto de la demanda', 'La parte de antecedentes'], a: 1, exp: 'Estructura: antecedentes, considerandos y puntos resolutivos.' },
  { id: 94, block: 4, topic: 'Tema 19', q: 'La diferencia entre un acuerdo y una resolución interlocutoria es que:', opts: ['Son sinónimos', 'El acuerdo es una determinación de trámite; la resolución interlocutoria resuelve un incidente', 'El acuerdo resuelve el fondo', 'La interlocutoria no requiere fundamentación'], a: 1, exp: 'Los acuerdos dan pauta al procedimiento; las interlocutorias resuelven cuestiones incidentales.' },
  { id: 95, block: 4, topic: 'Tema 20', q: 'El arraigo como providencia cautelar consiste en:', opts: ['Detener al demandado', 'Prevenir al demandado que no se ausente del lugar de su residencia sin dejar representante legítimo, suficientemente instruido y expensado', 'Embargo automático de cuentas', 'Suspender el contrato laboral'], a: 1, exp: 'Se decreta de plano y no implica detención corporal.' },
  { id: 96, block: 4, topic: 'Tema 20', q: '¿En qué tiempo puede el Tribunal decretar el embargo precautorio (art. 861)?', opts: ['En 48 horas', 'Dentro de las 24 horas siguientes a la solicitud', 'En 5 días', 'En una semana'], a: 1, exp: 'El Tribunal valora circunstancias y pruebas para decretar la medida precautoria.' },
  { id: 97, block: 4, topic: 'Tema 20', q: 'Una medida cautelar específica del art. 857 LFT para trabajadora embarazada despedida es:', opts: ['La reinstalación inmediata sin trámite', 'Requerir al patrón abstenerse de dar de baja de seguridad social, presentando certificado médico', 'Un pago anticipado', 'La nulidad automática del despido'], a: 1, exp: 'Es una de las medidas reforzadas para proteger derechos fundamentales y evitar discriminación.' },
  { id: 98, block: 4, topic: 'Tema 20', q: 'Las providencias cautelares en el proceso laboral son:', opts: ['Dictadas solo después del laudo', 'Medidas precautorias dictadas por el juez (con facultad del secretario) para asegurar la efectividad de la sentencia o evitar daños irreparables durante el proceso', 'Exclusivas del procedimiento de huelga', 'Voluntarias para el demandado'], a: 1, exp: 'Su finalidad es preservar la eficacia del proceso.' },
  { id: 99, block: 4, topic: 'Tema 21', q: 'Antes de acudir a los tribunales laborales, los trabajadores y patrones deberán:', opts: ['Contratar abogado certificado', 'Asistir al Centro de Conciliación correspondiente, salvo excepciones legales', 'Notificar a la STPS directamente', 'Obtener un dictamen pericial previo'], a: 1, exp: 'Es requisito de procedibilidad agotar la conciliación prejudicial salvo supuestos exceptuados.' },
  { id: 100, block: 4, topic: 'Tema 21', q: 'La audiencia de conciliación prejudicial se celebrará dentro de:', opts: ['5 días', '10 días', '15 días siguientes a la solicitud', '30 días'], a: 2, exp: 'El citatorio se notifica personalmente al patrón con al menos 5 días de anticipación.' },
  { id: 101, block: 4, topic: 'Tema 21', q: 'Una vez celebrado el convenio ante los Centros de Conciliación:', opts: ['Solo es opinión orientativa', 'Adquiere la condición de cosa juzgada con calidad de título ejecutivo, sin necesidad de ratificación', 'Necesita ratificación judicial posterior', 'Puede revocarse libremente por cualquier parte'], a: 1, exp: 'El convenio conciliatorio es título suficiente para iniciar acciones ejecutivas.' },
  { id: 102, block: 4, topic: 'Tema 21', q: 'El procedimiento ordinario consta de:', opts: ['Una sola audiencia oral', 'Fase escrita (demanda, contestación, réplica, contrarréplica) y fase oral (audiencia preliminar y de juicio)', 'Solo etapa escrita', 'Solo etapa oral'], a: 1, exp: 'Tras la fijación de litis escrita, sigue la fase oral en dos audiencias.' },
  { id: 103, block: 4, topic: 'Tema 21', q: 'La audiencia preliminar tiene como objeto principal:', opts: ['Dictar sentencia', 'Depurar el proceso, fijar los hechos controvertidos y admitir o desechar las pruebas', 'Concluir la conciliación', 'Practicar la totalidad del desahogo probatorio'], a: 1, exp: 'En la audiencia de juicio se desahogan pruebas y se formulan alegatos.' },
  { id: 104, block: 4, topic: 'Tema 22', q: 'En el procedimiento especial, ¿en qué plazo debe contestarse la demanda?', opts: ['5 días', '10 días', '15 días', '20 días'], a: 1, exp: 'En procedimiento especial los plazos se acortan: 10 días para contestar, 3 para réplica y 3 para contrarréplica.' },
  { id: 105, block: 4, topic: 'Tema 22', q: 'El procedimiento especial se diferencia del ordinario porque:', opts: ['Es más lento por su rigor formal', 'Está diseñado para resolver conflictos de forma rápida y concentrada', 'Solo aplica para huelga', 'Tiene más audiencias y plazos'], a: 1, exp: 'Todo lo que la ley no establezca como especial se tramita por vía ordinaria.' },
  { id: 106, block: 4, topic: 'Tema 22', q: 'En la mayoría de procedimientos especiales, la sentencia se dicta:', opts: ['Por escrito a los 30 días', 'En la misma audiencia, o con plazo adicional hasta cinco días en casos excepcionales', 'Después de seis meses', 'Solo cuando lo soliciten las partes'], a: 1, exp: 'La inmediatez resolutiva es característica del procedimiento especial.' },
  { id: 107, block: 4, topic: 'Tema 22', q: 'En el procedimiento especial, el plazo para presentar la demanda es de:', opts: ['5 días', '10 días', '15 días', '20 días'], a: 1, exp: 'Plazos acortados característicos del procedimiento especial.' },
  { id: 108, block: 4, topic: 'Tema 22', q: 'En procedimientos especiales, el auto de depuración debe dictarse en un plazo aproximado de:', opts: ['3 días', '5 días', '15 días tras la contrarréplica', '30 días'], a: 2, exp: 'La depuración prepara la audiencia oral.' },

  // === BLOQUE 5: CONFLICTOS COLECTIVOS Y HUELGA (Temas 23-26) — 27 preguntas ===
  { id: 109, block: 5, topic: 'Tema 23', q: 'Los conflictos colectivos de naturaleza económica (art. 900) son aquellos cuyo planteamiento tiene por objeto:', opts: ['Conflictos sobre interpretación de contratos individuales', 'La modificación o implantación de nuevas condiciones de trabajo, o la suspensión o terminación de las relaciones colectivas de trabajo', 'Conflictos entre dos sindicatos', 'Conflictos sobre prestaciones individuales únicamente'], a: 1, exp: 'Art. 900 LFT.' },
  { id: 110, block: 5, topic: 'Tema 23', q: '¿Quiénes pueden plantear conflictos colectivos de naturaleza económica (art. 903)?', opts: ['Solo los patrones', 'Sindicatos titulares de contratos colectivos, mayoría de trabajadores de una empresa, o el patrón o patrones', 'Únicamente la STPS', 'Solo un trabajador individualmente'], a: 1, exp: 'Tres sujetos legitimados con requisitos específicos de prueba documental.' },
  { id: 111, block: 5, topic: 'Tema 23', q: 'En conflictos colectivos económicos, las pruebas de recuento sirven para:', opts: ['Contar votos en una huelga', 'Verificar información económica controvertida, elaborando un padrón confiable', 'Determinar la antigüedad de los trabajadores', 'Asignar utilidades anuales'], a: 1, exp: 'El tribunal puede solicitar información al IMSS, al Centro de Conciliación y al patrón.' },
  { id: 112, block: 5, topic: 'Tema 24', q: 'La huelga es:', opts: ['Un derecho individual de cada trabajador', 'La suspensión total de labores de la fuente de trabajo, en un día y hora específicos, llevada a cabo por una coalición de trabajadores', 'Una indemnización colectiva', 'Una revisión anual obligatoria de contrato'], a: 1, exp: 'Es un derecho colectivo de la coalición.' },
  { id: 113, block: 5, topic: 'Tema 24', q: '¿Con cuánta anticipación debe darse el aviso para suspensión de labores?', opts: ['3 días generales', 'Al menos 6 días con anticipación, y 10 días en servicios públicos', '15 días siempre', '30 días en todos los casos'], a: 1, exp: 'El término de prehuelga es de 6 o 10 días según el caso (art. 920 fracc. III).' },
  { id: 114, block: 5, topic: 'Tema 24', q: 'Cuando el objeto de la huelga sea la celebración del contrato colectivo, deberá anexarse:', opts: ['Lista de afiliados sindicales', 'Constancia de Representatividad expedida por el Centro Federal de Conciliación y Registro Laboral', 'Estatutos sindicales completos', 'Inventario de bienes del sindicato'], a: 1, exp: 'Requisito introducido para garantizar legitimación auténtica del sindicato emplazante (art. 920 fracc. IV y 390 Bis).' },
  { id: 115, block: 5, topic: 'Tema 24', q: '¿En qué plazo el patrón debe contestar el pliego de peticiones?', opts: ['24 horas', '48 horas siguientes a la notificación, ante el Tribunal', '5 días', '10 días'], a: 1, exp: 'Art. 922 LFT: contestación por escrito ante el Tribunal en 48 horas.' },

const BLOCKS = {
  1: { name: 'Parte General', short: 'Temas 1-7' },
  2: { name: 'Demanda y Actuaciones', short: 'Temas 8-12' },
  3: { name: 'Pruebas', short: 'Temas 13-18' },
  4: { name: 'Resoluciones y Procedimientos', short: 'Temas 19-22' },
  5: { name: 'Conflictos Colectivos y Huelga', short: 'Temas 23-26' },
  6: { name: 'Ejecución y Paraprocesales', short: 'Temas 27-29' },
};

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function App() {
  const [started, setStarted] = useState(false);
  const [randomize, setRandomize] = useState(false);
  const [selectedBlock, setSelectedBlock] = useState(0); // 0 = all blocks
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [answers, setAnswers] = useState([]);
  const [questionOrder, setQuestionOrder] = useState([]);

  const orderedQuestions = useMemo(
    () => questionOrder.map(i => QUESTIONS[i]),
    [questionOrder]
  );

  const q = orderedQuestions[current];
  const total = orderedQuestions.length;
  const correctCount = answers.filter(a => a.correct).length;

  function start() {
    let pool = QUESTIONS.map((_, i) => i);
    if (selectedBlock > 0) {
      pool = pool.filter(i => QUESTIONS[i].block === selectedBlock);
    }
    setQuestionOrder(randomize ? shuffleArray(pool) : pool);
    setStarted(true);
    setCurrent(0);
    setSelected(null);
    setAnswered(false);
    setAnswers([]);
  }

  function selectOption(idx) {
    if (answered) return;
    setSelected(idx);
    setAnswered(true);
    setAnswers(prev => [...prev, { id: q.id, block: q.block, correct: idx === q.a, selected: idx }]);
  }

  function next() {
    if (current + 1 < total) {
      setCurrent(current + 1);
      setSelected(null);
      setAnswered(false);
    } else {
      setCurrent(total);
    }
  }

  function restart() {
    setStarted(false);
    setCurrent(0);
    setSelected(null);
    setAnswered(false);
    setAnswers([]);
  }

  if (!started) {
    return (
      <div className="min-h-screen w-full bg-stone-50 flex items-center justify-center p-6">
        <div className="max-w-2xl w-full bg-white rounded-lg shadow-sm border border-stone-200 p-8 md:p-12">
          <div className="flex items-center gap-3 mb-6">
            <div className="p-2 bg-slate-800 rounded">
              <Book className="w-5 h-5 text-white" />
            </div>
            <span className="text-xs uppercase tracking-widest text-stone-500 font-medium">UAdeC · Facultad de Jurisprudencia</span>
          </div>
          <h1 className="text-3xl md:text-4xl font-serif text-slate-900 mb-3 leading-tight">
            Derecho Procesal del Trabajo
          </h1>
          <p className="text-stone-600 mb-8 text-lg">
            Quiz de estudio · 150 preguntas de opción múltiple
          </p>

          <div className="space-y-3 mb-6">
            <div className="border-l-2 border-slate-800 pl-4 py-1">
              <h3 className="text-sm font-semibold text-slate-900 mb-2">Estructura por bloques</h3>
              <ul className="text-sm text-stone-600 space-y-1">
                {Object.entries(BLOCKS).map(([k, b]) => {
                  const count = QUESTIONS.filter(qq => qq.block === parseInt(k)).length;
                  return (
                    <li key={k} className="flex justify-between">
                      <span>{b.name} <span className="text-stone-400">({b.short})</span></span>
                      <span className="text-stone-500 tabular-nums">{count} preg.</span>
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>

          <div className="mb-6">
            <label className="block text-sm font-semibold text-slate-900 mb-2">Modo de estudio</label>
            <select
              value={selectedBlock}
              onChange={e => setSelectedBlock(parseInt(e.target.value))}
              className="w-full p-2.5 border border-stone-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-slate-800 focus:border-slate-800 bg-white"
            >
              <option value={0}>Todos los bloques (150 preguntas)</option>
              {Object.entries(BLOCKS).map(([k, b]) => {
                const count = QUESTIONS.filter(qq => qq.block === parseInt(k)).length;
                return (
                  <option key={k} value={k}>
                    Solo Bloque {k}: {b.name} ({count} preguntas)
                  </option>
                );
              })}
            </select>
          </div>

          <label className="flex items-center gap-3 mb-6 cursor-pointer group">
            <input
              type="checkbox"
              checked={randomize}
              onChange={e => setRandomize(e.target.checked)}
              className="w-4 h-4 accent-slate-800"
            />
            <ShuffleIcon className="w-4 h-4 text-stone-500" />
            <span className="text-sm text-stone-700 group-hover:text-slate-900">
              Orden aleatorio de preguntas
            </span>
          </label>

          <button
            onClick={start}
            className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 px-6 rounded font-medium transition-colors flex items-center justify-center gap-2"
          >
            Comenzar quiz
            <ChevRight className="w-4 h-4" />
          </button>

          <p className="text-xs text-stone-400 mt-6 text-center">
            Retroalimentación inmediata con base legal de cada respuesta · Conforme a la LFT vigente
          </p>
        </div>
      </div>
    );
  }

  if (current >= total) {
    const pct = Math.round((correctCount / total) * 100);
    const blocksInPlay = [...new Set(answers.map(a => a.block))].sort();
    const blockStats = blocksInPlay.map(k => {
      const b = BLOCKS[k];
      const blockAnswers = answers.filter(a => a.block === k);
      const blockCorrect = blockAnswers.filter(a => a.correct).length;
      return {
        block: k,
        name: b.name,
        short: b.short,
        correct: blockCorrect,
        total: blockAnswers.length,
        pct: blockAnswers.length > 0 ? Math.round((blockCorrect / blockAnswers.length) * 100) : 0,
      };
    });

    let grade, gradeColor, gradeText;
    if (pct >= 90) { grade = 'Excelente'; gradeColor = 'text-emerald-700'; gradeText = 'Dominio sólido del temario.'; }
    else if (pct >= 75) { grade = 'Muy bien'; gradeColor = 'text-emerald-600'; gradeText = 'Buen manejo. Repasa los puntos donde fallaste.'; }
    else if (pct >= 60) { grade = 'Suficiente'; gradeColor = 'text-amber-600'; gradeText = 'Hay áreas claras de oportunidad.'; }
    else { grade = 'Reforzar'; gradeColor = 'text-rose-700'; gradeText = 'Conviene un repaso integral antes de la siguiente vuelta.'; }

    return (
      <div className="min-h-screen w-full bg-stone-50 p-6">
        <div className="max-w-3xl mx-auto">
          <div className="bg-white rounded-lg shadow-sm border border-stone-200 p-8 md:p-10">
            <div className="flex items-center gap-3 mb-2">
              <TrophyIcon className="w-5 h-5 text-slate-700" />
              <span className="text-xs uppercase tracking-widest text-stone-500 font-medium">Resultado final</span>
            </div>
            <h2 className="text-3xl font-serif text-slate-900 mb-1">Quiz completado</h2>
            <p className="text-stone-600 mb-8">Desempeño general por bloque temático</p>

            <div className="bg-stone-50 rounded-lg p-6 mb-8 border border-stone-200">
              <div className="flex items-baseline justify-between mb-4">
                <span className="text-stone-600 text-sm">Puntuación</span>
                <span className={`text-sm font-semibold ${gradeColor}`}>{grade}</span>
              </div>
              <div className="flex items-baseline gap-3 mb-2">
                <span className="text-5xl font-serif text-slate-900 tabular-nums">{correctCount}</span>
                <span className="text-2xl text-stone-400 tabular-nums">/ {total}</span>
                <span className="ml-auto text-3xl font-serif text-slate-900 tabular-nums">{pct}%</span>
              </div>
              <div className="w-full h-2 bg-stone-200 rounded-full overflow-hidden mt-3">
                <div className="h-full bg-slate-800 transition-all duration-700" style={{ width: `${pct}%` }} />
              </div>
              <p className="text-sm text-stone-600 mt-3">{gradeText}</p>
            </div>

            <h3 className="text-sm font-semibold text-slate-900 mb-4 uppercase tracking-wide">Desglose por bloque</h3>
            <div className="space-y-3 mb-8">
              {blockStats.map(s => (
                <div key={s.block} className="border border-stone-200 rounded p-4">
                  <div className="flex justify-between items-baseline mb-2">
                    <div>
                      <span className="text-xs text-stone-500">Bloque {s.block}</span>
                      <h4 className="font-medium text-slate-900">{s.name}</h4>
                      <span className="text-xs text-stone-400">{s.short}</span>
                    </div>
                    <div className="text-right">
                      <div className="text-lg font-serif text-slate-900 tabular-nums">{s.correct}/{s.total}</div>
                      <div className="text-sm text-stone-500 tabular-nums">{s.pct}%</div>
                    </div>
                  </div>
                  <div className="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-500 ${s.pct >= 75 ? 'bg-emerald-600' : s.pct >= 60 ? 'bg-amber-500' : 'bg-rose-500'}`}
                      style={{ width: `${s.pct}%` }}
                    />
                  </div>
                </div>
              ))}
            </div>

            <button
              onClick={restart}
              className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 px-6 rounded font-medium transition-colors flex items-center justify-center gap-2"
            >
              <Rotate className="w-4 h-4" />
              Reiniciar quiz
            </button>
          </div>
        </div>
      </div>
    );
  }

  const progress = ((current + 1) / total) * 100;
  const blockInfo = BLOCKS[q.block];

  return (
    <div className="min-h-screen w-full bg-stone-50 p-4 md:p-6">
      <div className="max-w-2xl mx-auto">
        <div className="mb-6">
          <div className="flex items-center justify-between text-xs text-stone-500 mb-2">
            <span className="uppercase tracking-widest font-medium">
              Pregunta {current + 1} <span className="text-stone-400">de {total}</span>
            </span>
            <span className="tabular-nums">
              {correctCount} {correctCount === 1 ? 'acierto' : 'aciertos'}
            </span>
          </div>
          <div className="w-full h-1 bg-stone-200 rounded-full overflow-hidden">
            <div className="h-full bg-slate-800 transition-all duration-300" style={{ width: `${progress}%` }} />
          </div>
          <div className="flex items-center gap-2 mt-3 text-xs flex-wrap">
            <span className="px-2 py-0.5 bg-slate-900 text-white rounded font-medium">Bloque {q.block}</span>
            <span className="text-stone-600">{blockInfo.name}</span>
            <span className="text-stone-400">·</span>
            <span className="text-stone-500">{q.topic}</span>
          </div>
        </div>

        <div className="bg-white rounded-lg shadow-sm border border-stone-200 p-6 md:p-8 mb-4">
          <h2 className="text-lg md:text-xl text-slate-900 mb-6 leading-relaxed font-medium">{q.q}</h2>

          <div className="space-y-2.5">
            {q.opts.map((opt, idx) => {
              const isSelected = selected === idx;
              const isCorrect = idx === q.a;
              const showCorrect = answered && isCorrect;
              const showIncorrect = answered && isSelected && !isCorrect;

              let classes = 'w-full text-left p-4 rounded border transition-all flex items-start gap-3 ';
              if (!answered) {
                classes += 'border-stone-200 hover:border-slate-400 hover:bg-stone-50 cursor-pointer';
              } else if (showCorrect) {
                classes += 'border-emerald-500 bg-emerald-50 text-emerald-900';
              } else if (showIncorrect) {
                classes += 'border-rose-400 bg-rose-50 text-rose-900';
              } else {
                classes += 'border-stone-200 text-stone-500';
              }

              return (
                <button key={idx} onClick={() => selectOption(idx)} disabled={answered} className={classes}>
                  <span className={`flex-shrink-0 w-6 h-6 rounded-full border flex items-center justify-center text-xs font-semibold mt-0.5 ${
                    showCorrect ? 'border-emerald-600 bg-emerald-600 text-white' :
                    showIncorrect ? 'border-rose-500 bg-rose-500 text-white' :
                    isSelected ? 'border-slate-800' : 'border-stone-300 text-stone-500'
                  }`}>
                    {showCorrect ? '✓' : showIncorrect ? '✕' : String.fromCharCode(65 + idx)}
                  </span>
                  <span className="flex-1 leading-relaxed text-sm md:text-base">{opt}</span>
                </button>
              );
            })}
          </div>

          {answered && (
            <div className={`mt-5 p-4 rounded border ${selected === q.a ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}>
              <div className="flex items-start gap-2.5">
                {selected === q.a ?
                  <CheckIcon className="w-5 h-5 text-emerald-600 flex-shrink-0 mt-0.5" /> :
                  <XIcon className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                }
                <div className="flex-1">
                  <p className={`text-sm font-semibold mb-1 ${selected === q.a ? 'text-emerald-900' : 'text-amber-900'}`}>
                    {selected === q.a ? 'Correcto' : 'Respuesta correcta: ' + String.fromCharCode(65 + q.a)}
                  </p>
                  <p className={`text-sm leading-relaxed ${selected === q.a ? 'text-emerald-800' : 'text-amber-800'}`}>
                    {q.exp}
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>

        {answered && (
          <button
            onClick={next}
            className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 px-6 rounded font-medium transition-colors flex items-center justify-center gap-2"
          >
            {current + 1 === total ? 'Ver resultados' : 'Siguiente pregunta'}
            <ChevRight className="w-4 h-4" />
          </button>
        )}

        <div className="text-center mt-4">
          <button onClick={restart} className="text-xs text-stone-500 hover:text-slate-900 transition-colors inline-flex items-center gap-1">
            <Rotate className="w-3 h-3" />
            Reiniciar
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
